<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X Themes</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <header class="popup-header">
      <span class="eyebrow">GOOHUB EXTENSION</span>
      <h1>X Themes</h1>
      <p>Choose a look for X or Twitter.</p>
    </header>

    <div class="field">
      <label for="theme">Theme</label>
      <select id="theme" name="theme"></select>
    </div>

    <div class="button-row">
      <button id="random" class="button button-secondary" type="button">Preview random</button>
      <button id="apply" class="button button-primary" type="button">Save theme</button>
    </div>

    <div class="button-row button-row-secondary">
      <button id="export" class="button button-quiet" type="button">Export settings</button>
      <button id="import-button" class="button button-quiet" type="button">Import settings</button>
      <input id="import" type="file" accept="application/json,.json" hidden>
    </div>

    <p id="status" class="status" role="status" aria-live="polite"></p>
    <p class="hint">Preview a theme first, then save it to use on future visits.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
